    const calculateMinutesDiff = (startStr, endStr) => {
      if (!startStr || !endStr) return 45;
      const [sh, sm] = startStr.split(':').map(Number);
      const [eh, em] = endStr.split(':').map(Number);
      const diff = (eh * 60 + em) - (sh * 60 + sm);
      return diff > 0 ? diff : 1;
    };

    const getChlorineStatus = (val) => {
      const n = parseFloat(val);
      if (isNaN(n)) return { label: 'Sin dato', color: 'text-slate-400', bg: 'bg-slate-800' };
      if (n < 1.0) return { label: 'Bajo (<1.0 ppm)', color: 'text-amber-400', bg: 'bg-amber-950/60 border-amber-700/50' };
      if (n <= 3.0) return { label: 'Óptimo (1.0 - 3.0 ppm)', color: 'text-emerald-400', bg: 'bg-emerald-950/60 border-emerald-700/50' };
      return { label: 'Alto (>3.0 ppm)', color: 'text-rose-400', bg: 'bg-rose-950/60 border-rose-700/50' };
    };

    const getPhStatus = (val) => {
      const n = parseFloat(val);
      if (isNaN(n)) return { label: 'Sin dato', color: 'text-slate-400', bg: 'bg-slate-800' };
      if (n < 7.2) return { label: 'Ácido (<7.2)', color: 'text-amber-400', bg: 'bg-amber-950/60 border-amber-700/50' };
      if (n <= 7.6) return { label: 'Óptimo (7.2 - 7.6)', color: 'text-emerald-400', bg: 'bg-emerald-950/60 border-emerald-700/50' };
      return { label: 'Alcalino (>7.6)', color: 'text-rose-400', bg: 'bg-rose-950/60 border-rose-700/50' };
    };

    const compressImage = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxW = 900;
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    const encodeOrderForShare = (order) => {
      try {
        const liteOrder = {
          ...order,
          fotos: order.fotos.map(f => ({

            url: f.url.startsWith('data:image/svg') ? f.url : createDemoPhoto(f.type, f.caption || (f.type === 'before' ? 'Recepción en Terreno' : 'Entrega Finalizada'), `Orden ${order.id}`)
          }))
        };
        const json = JSON.stringify(liteOrder);
        return btoa(unescape(encodeURIComponent(json)));
      } catch (e) {
        return '';
      }
    };

    const decodeOrderFromShare = (encoded) => {
      try {
        const json = decodeURIComponent(escape(atob(encoded)));
        return JSON.parse(json);
      } catch (e) {
        return null;
      }
    };

    function SignaturePad({ onSave, existingSignature }) {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [hasDrawn, setHasDrawn] = useState(false);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }, []);

      const getCoords = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      const startDraw = (e) => {
        const ctx = canvasRef.current.getContext('2d');
        const { x, y } = getCoords(e);
        ctx.beginPath();
        ctx.moveTo(x, y);
        setIsDrawing(true);
        setHasDrawn(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const ctx = canvasRef.current.getContext('2d');
        const { x, y } = getCoords(e);
        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const endDraw = () => {
        if (!isDrawing) return;
        setIsDrawing(false);
        if (canvasRef.current && onSave) {
          onSave(canvasRef.current.toDataURL('image/png'));
        }
      };

      const clearPad = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        setHasDrawn(false);
        if (onSave) onSave('');
      };

      if (existingSignature) {
        return (
          <div className="bg-slate-900 border border-emerald-700/50 rounded-xl p-3 text-center">
            <p className="text-xs text-emerald-400 mb-2 font-medium">Firma Digital Registrada</p>
            <img src={existingSignature} alt="Firma cliente" className="max-h-24 mx-auto bg-slate-950 rounded-lg p-2 border border-slate-800" />
          </div>
        );
      }

      return (
        <div className="space-y-2">
          <div className="relative bg-slate-950 border-2 border-dashed border-slate-700 rounded-xl overflow-hidden">
            <canvas
              ref={canvasRef}
              width={500}
              height={160}
              className="w-full h-36 cursor-crosshair block"
              onMouseDown={startDraw}
              onMouseMove={draw}
              onMouseUp={endDraw}
              onMouseLeave={endDraw}
              onTouchStart={startDraw}
              onTouchMove={draw}
              onTouchEnd={endDraw}
            />
            {!hasDrawn && (
              <div className="pointer-events-none absolute inset-0 flex items-center justify-center text-slate-500 text-sm">
                Dibuja tu firma aquí con el dedo o puntero
              </div>
            )}
          </div>
          <div className="flex justify-end">
            <button
              type="button"
              onClick={clearPad}
              className="text-xs text-slate-400 hover:text-cyan-400 px-2.5 py-1 rounded bg-slate-800/80 transition"
            >
              Limpiar firma
            </button>
          </div>
        </div>
      );
    }

    function App() {

        const params = new URLSearchParams(window.location.search);
        const sharedFicha = params.get('ficha');
        const ordenParam = params.get('orden');

        if (sharedFicha) {
          const decoded = decodeOrderFromShare(sharedFicha);
          if (decoded && decoded.id) {
            setOrders(prev => {
              const exists = prev.some(o => o.id === decoded.id);
              return exists ? prev.map(o => o.id === decoded.id ? decoded : o) : [decoded, ...prev];
            });
            setActiveOrderId(decoded.id);
            setViewMode('client');
          }
        } else if (ordenParam) {
          setActiveOrderId(ordenParam);
          setViewMode('client');
        }
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem('tacticalpool_orders_v1', JSON.stringify(orders));
        } catch (e) {
          console.warn('Almacenamiento local lleno', e);
        }
      }, [orders]);

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      const activeOrder = orders.find(o => o.id === activeOrderId) || orders[0];

      const updateActiveOrder = (updater) => {
        setOrders(prev =>
          prev.map(order => {
            if (order.id !== activeOrder.id) return order;
            return typeof updater === 'function' ? updater(order) : { ...order, ...updater };
          })
        );
      };

      const openWhatsApp = (phone, message) => {
        const cleanPhone = (phone || '').replace(/\D/g, '');
        const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
      };

      const getShareableClientLink = (order) => {
        const baseUrl = window.location.href.split('?')[0];
        const encoded = encodeOrderForShare(order);
        return `${baseUrl}?orden=${order.id}&ficha=${encoded}`;
      };

      const handleNotifyEnCamino = () => {
        const now = getCurrentTimeStr();
        updateActiveOrder({ estado: 'En Camino' });
        const msg = `Hola ${activeOrder.nombre}, te saluda *${activeOrder.tecnico}* de *TACTICALPOOL* ("Precisión en cada gota"). 🚐💧\n\nTe aviso que voy *en camino* hacia tu domicilio (${activeOrder.direccion}) para el mantenimiento de tu piscina. Hora de aviso: ${now} hrs.`;
        notify('Estado cambiado a "En Camino"');
        openWhatsApp(activeOrder.telefono, msg);
      };

      const handleNotifyLlegada = () => {
        const now = getCurrentTimeStr();
        updateActiveOrder({
          estado: 'En Servicio',
          horaLlegada: activeOrder.horaLlegada || now
        });
        const msg = `Hola ${activeOrder.nombre}, *TACTICALPOOL* informa que ya llegamos a tu domicilio e iniciamos la *Recepción del Servicio* a las *${now} hrs*. 🏊‍♂️✅\n\nRealizaremos el protocolo técnico completo de 9 puntos.`;
        notify(`Recepción registrada a las ${now} hrs`);
        openWhatsApp(activeOrder.telefono, msg);
      };

      const handleNotifyEntrega = () => {
        const now = getCurrentTimeStr();
        const llegada = activeOrder.horaLlegada || now;
        const mins = calculateMinutesDiff(llegada, now);
        const updated = {
          ...activeOrder,
          estado: 'Finalizado',
          horaLlegada: llegada,
          horaSalida: now,
          duracionMinutos: mins
        };
        updateActiveOrder(updated);

        const doneCount = Object.values(updated.checklist).filter(Boolean).length;
        const shareLink = getShareableClientLink(updated);
        const msg = `Hola ${updated.nombre}, *TACTICALPOOL* ha finalizado la *Entrega del Servicio* a las *${now} hrs* (${mins} min en sitio). 💧✨\n\n📋 *Checklist:* ${doneCount}/9 puntos completados\n🧪 *Cloro:* ${updated.quimica.cloro} ppm | *pH:* ${updated.quimica.ph}\n\nRevisa tus fotos, checklist y firma tu recepción conforme aquí:\n${shareLink}`;
        notify(`Servicio entregado (${now} hrs)`);
        openWhatsApp(updated.telefono, msg);
      };

        const link = getShareableClientLink(activeOrder);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(() => notify('Enlace del Portal Cliente copiado al portapapeles'));
        } else {
          prompt('Copia este enlace para enviarlo al cliente:', link);
        }
      };

      const toggleChecklistItem = (key) => {
        updateActiveOrder(prev => ({

          checklist: {
            ...prev.checklist,
            [key]: !prev.checklist[key]
          }
        }));
      };

        const updatedChecklist = {};

          updatedChecklist[item.id] = value;
        });
        updateActiveOrder({ checklist: updatedChecklist });
        notify(value ? 'Los 9 puntos marcados como realizados' : 'Checklist reiniciado');
      };

      const toggleProduct = (prod) => {
        updateActiveOrder(prev => {
          const list = prev.quimica.productosUsados || [];
          const exists = list.includes(prod);
          return {
            ...prev,
            quimica: {
              ...prev.quimica,
              productosUsados: exists ? list.filter(p => p !== prod) : [...list, prod]
            }
          };
        });
      };

      const handlePhotoUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        const now = getCurrentTimeStr();
        const newPhotos = [];

        for (const file of files) {
          const compressedUrl = await compressImage(file);
          newPhotos.push({
            id: `photo-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            type: photoType,
            url: compressedUrl,
            caption: photoCaption.trim() || (photoType === 'before' ? 'Estado inicial / Recepción' : 'Resultado final / Entrega'),
            timestamp: now

        updateActiveOrder(prev => ({
          ...prev,
          fotos: [...prev.fotos, ...newPhotos]

        setPhotoCaption('');
        notify(`${newPhotos.length} fotografía(s) adjuntada(s)`);
        e.target.value = '';

                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {activeOrder.fotos.map(foto => (
                        <div key={foto.id} className="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden group relative">
                          <div className="relative">
                            <img src={foto.url} alt={foto.caption} className="w-full h-48 object-cover" />
                            <span
                              className={`absolute top-2.5 left-2.5 text-[11px] font-black px-2.5 py-1 rounded-lg uppercase shadow ${
                                foto.type === 'before'
                                  ? 'bg-amber-500 text-slate-950'
                                  : 'bg-emerald-500 text-slate-950'
                              }`}
                            >
                              {foto.type === 'before' ? 'Antes' : 'Después'}
                            </span>
                            <button
                              type="button"
                              onClick={() => removePhoto(foto.id)}
                              className="no-print absolute top-2.5 right-2.5 bg-slate-950/80 hover:bg-rose-600 text-white w-7 h-7 rounded-lg text-xs font-bold transition"
                              title="Eliminar foto"
                            >
                              ✕
                            </button>
                          </div>
                          <div className="p-3 flex justify-between items-center gap-2">
                            <p className="text-xs text-slate-200 font-medium truncate">{foto.caption}</p>
                            <span className="text-[11px] text-slate-500 shrink-0">{foto.timestamp} hrs</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </section>
            </main>
          ) : (
            <main className="max-w-4xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
              <div className="bg-gradient-to-r from-slate-900 via-slate-900 to-cyan-950/50 border border-cyan-800/40 rounded-2xl p-6 shadow-xl print-card">
                <div className="flex flex-wrap items-start justify-between gap-4">
                  <div>
                    <span className="text-xs font-mono text-cyan-400 font-bold">ORDEN DE SERVICIO {activeOrder.id}</span>
                    <h2 className="text-2xl font-black text-white mt-1">Hola, {activeOrder.nombre}</h2>
                    <p className="text-sm text-slate-300 mt-1">📍 {activeOrder.direccion}</p>
                    <p className="text-xs text-slate-400 mt-1">
                      Piscina: {activeOrder.tipoPiscina} • Técnico a cargo: <strong className="text-cyan-300">{activeOrder.tecnico}</strong>
                    </p>
                  </div>
                  <div className="text-left sm:text-right">
                    <span className={`inline-block text-xs px-3 py-1.5 rounded-full border font-bold ${statusBadge(activeOrder.estado)}`}>
                      Estado: {activeOrder.estado}
                    </span>
                    <p className="text-xs text-slate-400 mt-2">Fecha: {activeOrder.fechaServicio}</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-5 pt-5 border-t border-slate-800">
                  <div className="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800">
                    <p className="text-xs text-slate-400">Visita Programada</p>
                    <p className="text-lg font-bold text-white">{activeOrder.horaProgramada} hrs</p>
                  </div>
                  <div className="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800">
                    <p className="text-xs text-cyan-400">Recepción (Llegada)</p>
                    <p className="text-lg font-bold text-cyan-300">
                      {activeOrder.horaLlegada ? `${activeOrder.horaLlegada} hrs` : 'Pendiente de inicio'}
                    </p>
                  </div>
                  <div className="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800">
                    <p className="text-xs text-emerald-400">Entrega (Retiro)</p>
                    <p className="text-lg font-bold text-emerald-300">
                      {activeOrder.horaSalida
                        ? `${activeOrder.horaSalida} hrs (${activeOrder.duracionMinutos} min)`
                        : 'En ejecución'}
                    </p>
                  </div>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 print-card">
                <h3 className="font-bold text-lg text-white">💧 Balance Químico del Agua</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className={`p-4 rounded-xl border ${chlorineInfo.bg}`}>
                    <p className="text-xs text-slate-400 uppercase">Cloro Libre</p>
                    <div className="flex items-baseline justify-between mt-1">
                      <span className="text-2xl font-black text-white">{activeOrder.quimica.cloro} ppm</span>
                      <span className={`text-xs font-bold ${chlorineInfo.color}`}>{chlorineInfo.label}</span>
                    </div>
                  </div>
                  <div className={`p-4 rounded-xl border ${phInfo.bg}`}>
                    <p className="text-xs text-slate-400 uppercase">Nivel de pH</p>
                    <div className="flex items-baseline justify-between mt-1">
                      <span className="text-2xl font-black text-white">{activeOrder.quimica.ph}</span>
                      <span className={`text-xs font-bold ${phInfo.color}`}>{phInfo.label}</span>
                    </div>
                  </div>
                </div>

                {(activeOrder.quimica.productosUsados || []).length > 0 && (
                  <div className="pt-2">
                    <p className="text-xs text-slate-400 mb-2">Insumos aplicados en tu piscina:</p>
                    <div className="flex flex-wrap gap-2">
                      {activeOrder.quimica.productosUsados.map(prod => (
                        <span key={prod} className="text-xs px-3 py-1 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-700/50 font-semibold">
                          ✓ {prod}
                        </span>
                      ))}
                    </div>
                  </div>
                )}

                {activeOrder.notasTecnicas && (
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-sm text-slate-300">
                    <strong className="text-cyan-400 block text-xs uppercase mb-1">Informe del Técnico:</strong>
                    {activeOrder.notasTecnicas}
                  </div>
                )}
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 print-card">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-lg text-white">✅ Protocolo Realizado ({completedTasks}/{totalTasks})</h3>
                  <span className="text-sm font-black text-emerald-400">{progressPct}% Completado</span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {CHECKLIST_TEMPLATE.map(item => {
                    const done = !!activeOrder.checklist[item.id];
                    return (
                      <div
                        key={item.id}
                        className={`p-3 rounded-xl border flex items-center gap-3 ${
                          done
                            ? 'bg-emerald-950/30 border-emerald-700/40 text-emerald-100'
                            : 'bg-slate-950/60 border-slate-800 text-slate-500'
                        }`}
                      >
                        <span
                          className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-black shrink-0 ${
                            done ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-500'
                          }`}
                        >
                          {done ? '✓' : '•'}
                        </span>
                        <div>
                          <p className="text-sm font-bold">{item.label}</p>
                          <p className="text-[11px] text-slate-400">{item.descripcion}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 print-card">
                <h3 className="font-bold text-lg text-white">📸 Evidencia Fotográfica del Trabajo</h3>
                {activeOrder.fotos.length === 0 ? (
                  <p className="text-sm text-slate-400">El técnico aún no ha subido fotografías de esta visita.</p>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {activeOrder.fotos.map(foto => (
                      <div key={foto.id} className="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
                        <div className="relative">
                          <img src={foto.url} alt={foto.caption} className="w-full h-52 object-cover" />
                          <span
                            className={`absolute top-3 left-3 text-xs font-black px-3 py-1 rounded-lg uppercase ${
                              foto.type === 'before' ? 'bg-amber-500 text-slate-950' : 'bg-emerald-500 text-slate-950'
                            }`}
                          >
                            {foto.type === 'before' ? 'Recepción / Antes' : 'Entrega / Después'}
                          </span>
                        </div>
                        <div className="p-3 flex justify-between items-center text-xs">
                          <span className="text-slate-200 font-medium">{foto.caption}</span>
                          <span className="text-slate-500">{foto.timestamp} hrs</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 print-card">
                <h3 className="font-bold text-lg text-white">✍️ Recepción Conforme del Cliente</h3>

                {activeOrder.clientApproval?.aprobado ? (
                  <div className="bg-emerald-950/40 border border-emerald-600/50 rounded-xl p-5 space-y-3">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                      <p className="font-bold text-emerald-300 text-base">
                        ✓ Servicio Aprobado por {activeOrder.clientApproval.clientName}
                      </p>
                      <span className="text-xs text-emerald-400">
                        Registrado a las {activeOrder.clientApproval.aprobadoAt} hrs
                      </span>
                    </div>
                    {activeOrder.clientApproval.comentario && (
                      <p className="text-sm text-slate-200 italic">"{activeOrder.clientApproval.comentario}"</p>
                    )}
                    {activeOrder.clientApproval.firmaDataUrl && (
                      <SignaturePad existingSignature={activeOrder.clientApproval.firmaDataUrl} />
                    )}
                  </div>
                ) : (
                  <form onSubmit={handleApproveService} className="no-print space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Nombre quien recibe</label>
                        <input
                          type="text"
                          required
                          value={clientNameInput}
                          onChange={(e) => setClientNameInput(e.target.value)}
                          placeholder={activeOrder.nombre}
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                        />
                      </div>
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Comentario o evaluación (opcional)</label>
                        <input
                          type="text"
                          value={clientCommentInput}
                          onChange={(e) => setClientCommentInput(e.target.value)}
                          placeholder="Ej. Todo impecable, muchas gracias."
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs text-slate-400 mb-1.5">Firma digital</label>
                      <SignaturePad onSave={setClientSignatureData} />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-sm shadow-lg shadow-emerald-500/15 transition"
                    >
                      Confirmar Recepción Conforme
                    </button>
                  </form>
                )}
              </div>
            </main>
          )}

          <footer className="border-t border-slate-900 py-5 px-4 text-center text-xs text-slate-500">
            <strong className="text-slate-300">{BRAND_INFO.name}</strong> • "{BRAND_INFO.slogan}" • {BRAND_INFO.region} • Contacto: {BRAND_INFO.phoneDisplay}
          </footer>

          {showNewModal && (
            <div className="no-print fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="font-black text-lg text-white">Agendar Nueva Visita</h3>
                  <button onClick={() => setShowNewModal(false)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <form onSubmit={handleCreateClient} className="space-y-3">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Nombre del Cliente *</label>
                    <input
                      type="text"
                      required
                      value={newClient.nombre}
                      onChange={(e) => setNewClient({ ...newClient, nombre: e.target.value })}
                      placeholder="Ej. Familia Pérez"
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Dirección / Comuna *</label>
                    <input
                      type="text"
                      required
                      value={newClient.direccion}
                      onChange={(e) => setNewClient({ ...newClient, direccion: e.target.value })}
                      placeholder="Ej. Hacienda Lo Orozco, Casablanca"
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">WhatsApp (569...)</label>
                      <input
                        type="text"
                        value={newClient.telefono}
                        onChange={(e) => setNewClient({ ...newClient, telefono: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Hora Programada</label>
                      <input
                        type="time"
                        value={newClient.horaProgramada}
                        onChange={(e) => setNewClient({ ...newClient, horaProgramada: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Tipo de Piscina</label>
                      <input
                        type="text"
                        value={newClient.tipoPiscina}
                        onChange={(e) => setNewClient({ ...newClient, tipoPiscina: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Técnico Asignado</label>
                      <select
                        value={newClient.tecnico}
                        onChange={(e) => setNewClient({ ...newClient, tecnico: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                      >
                        {TECNICOS.map(t => (
                          <option key={t} value={t}>{t}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Notas de acceso</label>
                    <input
                      type="text"
                      value={newClient.notas}
                      onChange={(e) => setNewClient({ ...newClient, notas: e.target.value })}
                      placeholder="Clave portón, mascotas, horario bomba..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowNewModal(false)}
                      className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm font-semibold"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-sm font-black"
                    >
                      Guardar Visita
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
